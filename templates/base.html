
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block titulo %}AgroGest{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS personalizado -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <!-- Barra de navegação -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-agrogest">
        <div class="container">

            <!-- Nome do sistema -->
            <a class="navbar-brand fw-bold" href="{{ url_for('inicio') }}">
                AgroGest
            </a>

            <!-- Botão para dispositivos móveis -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal"
                aria-expanded="false"
                aria-label="Abrir menu"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Itens de navegação -->
            <div class="collapse navbar-collapse" id="menuPrincipal">

                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a class="nav-link active"
                           href="{{ url_for('inicio') }}">
                            Início
                        </a>
                    </li>

                    <!-- Rotas serão implementadas posteriormente -->
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Entregas
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Pagamentos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Fornecedores
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Estoque
                        </a>
                    </li>

                </ul>

                <!-- Acesso ao sistema -->
                <a href="#" class="btn btn-light btn-login">
                    Entrar
                </a>

            </div>
        </div>
    </nav>

    <!-- Conteúdo específico de cada página -->
    <main class="container my-5">
        {% block conteudo %}
        {% endblock %}
    </main>

    <!-- Rodapé -->
    <footer class="footer-agrogest text-center py-3">
        <div class="container">
            <small>
                AgroGest - Sistema de Gestão de Produção Agrícola
            </small>
        </div>
    </footer>

    <!-- JavaScript do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block scripts %}
    {% endblock %}

</body>
</html>
